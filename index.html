<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coração que Fala Te Amo</title>
      <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="Love-stage">
        <div id="bg-hearts"></div>
        <header>
            <h1 class="title-glow">Te amo</h1>
            <p>clique no coração e veja a magica!</p>
        </header>

        <div class="heart-area" id="heartArea">
            <div class="heart-wrap" id="heart" role="button" tabindex="0" aria-label="Clique para espalhar">
                <span class="heart-glow-ring"></span>
                <svp width="180" height="180" viewBox="0 0 32 29.6" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="heartFill" cx="35%" cy="30%" r="80%">
                            <stop offset="0%" stop-color="#f7a89a"/>
                            <stop offset="55%" stop-color=""
                        </radialGradient>
                    </defs>
        </div>
</body>
</html>
